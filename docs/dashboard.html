<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — AI SOC Analyst L1</title>
<meta name="description" content="Live incident dashboard for the AI SOC Analyst L1 pipeline.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<style>
:root{--bg:#050607;--p:#0a0d11;--p2:#0e1216;--ln:#161c22;--ln2:#232b34;--st:#46566a;--s3:#8b98a5;--s2:#b9c3cc;--ink:#e6edf3;
 --crit:#e5484d;--high:#f76b15;--med:#f5d90a;--low:#46a758;
 --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono)}
::selection{background:var(--st);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:#080b0e}
::-webkit-scrollbar-thumb{background:#232b34;border-radius:5px}::-webkit-scrollbar-thumb:hover{background:var(--st)}

nav{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;height:52px;border-bottom:1px solid var(--ln);background:rgba(5,6,7,.9);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:800;letter-spacing:.15em;
  text-transform:uppercase;color:var(--s2);text-decoration:none}
.brand svg{width:16px;height:16px}
.brand:hover{color:#fff}
.navr{display:flex;align-items:center;gap:8px}
.nl{font-size:11px;font-weight:700;color:var(--s3);text-decoration:none;padding:6px 11px;border-radius:7px}
.nl:hover{color:#fff;background:rgba(226,232,240,.07)}
.live{display:flex;align-items:center;gap:7px;font-size:9.5px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--s3);padding:5px 10px;border:1px solid var(--ln2);border-radius:7px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--low);animation:bl 1.7s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.2}}

main{max-width:1420px;margin:0 auto;padding:22px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--p);border:1px solid var(--ln);border-radius:11px;padding:13px 14px}
.kl{font-size:8.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--s3);font-weight:800}
.kv{font-size:25px;font-weight:850;letter-spacing:-.025em;line-height:1;margin-top:8px}
.ks{font-size:9.5px;color:#5b6b7a;margin-top:5px}

.charts{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:10px;margin-bottom:14px}
@media(max-width:1000px){.charts{grid-template-columns:1fr}}
.panel{background:var(--p);border:1px solid var(--ln);border-radius:11px;padding:14px}
.ph{font-size:8.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--s3);font-weight:800;margin-bottom:12px;
  display:flex;justify-content:space-between;align-items:center}
.lg{display:flex;flex-direction:column;gap:6px}
.lgi{display:flex;align-items:center;gap:8px;font-size:10.5px}
.lgi i{width:8px;height:8px;border-radius:2px;display:block}
.lgi span:nth-child(2){flex:1;color:var(--s3)}
.lgi b{font-variant-numeric:tabular-nums}
.bar{height:4px;background:#13181d;border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--st)}

.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.inp{background:var(--p);border:1px solid var(--ln2);border-radius:8px;padding:8px 11px;color:var(--ink);
  font-size:11.5px;font-family:var(--sans);min-width:200px}
.inp:focus{outline:none;border-color:var(--st)}
.seg{display:flex;border:1px solid var(--ln2);border-radius:8px;overflow:hidden}
.seg button{background:var(--p);border:none;color:var(--s3);font-size:11px;font-weight:700;padding:8px 12px;
  cursor:pointer;font-family:var(--sans);border-right:1px solid var(--ln2)}
.seg button:last-child{border:none}
.seg button.on{background:var(--ink);color:var(--bg)}
.count{margin-left:auto;font-size:10.5px;color:#5b6b7a}

table{width:100%;border-collapse:collapse;background:var(--p);border:1px solid var(--ln);border-radius:11px;overflow:hidden}
th{text-align:left;font-size:8.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--st);font-weight:800;
  padding:10px 12px;border-bottom:1px solid var(--ln2);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--ln);font-size:11.5px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:var(--p2)}
tr.new{animation:pulse 2.4s ease-out 1}
@keyframes pulse{0%{background:rgba(226,232,240,.13)}100%{background:transparent}}
.chip{display:inline-block;font-size:8.5px;font-weight:800;padding:3px 7px;border-radius:5px;letter-spacing:.04em}
.trunc{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--s3)}
.empty{padding:40px;text-align:center;color:#5b6b7a;font-size:12px}

/* ---- detail drawer ---- */
#scrim{position:fixed;inset:0;background:rgba(3,4,5,.72);backdrop-filter:blur(3px);z-index:50;opacity:0;
  visibility:hidden;transition:.28s}
#scrim.on{opacity:1;visibility:visible}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);border-left:1px solid var(--ln2);
  z-index:51;transform:translateX(100%);transition:transform .34s cubic-bezier(.2,.7,.3,1);overflow-y:auto}
#drawer.on{transform:none}
.dh{position:sticky;top:0;background:rgba(5,6,7,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln);
  padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;z-index:2}
.dc{padding:18px 20px}
.x{background:none;border:1px solid var(--ln2);color:var(--s3);width:28px;height:28px;border-radius:7px;
  cursor:pointer;font-size:15px;line-height:1;flex-shrink:0}
.x:hover{background:var(--p2);color:#fff}
.ring{width:58px;height:58px;flex-shrink:0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.tile{background:var(--p);border:1px solid var(--ln);border-radius:9px;padding:11px;text-align:center}
.tv{font-size:19px;font-weight:850;line-height:1}
.tl{font-size:8px;text-transform:uppercase;letter-spacing:.09em;color:var(--s3);margin-top:5px;font-weight:700}
.facts{width:100%;font-size:11.5px;margin-bottom:16px}
.facts td{padding:6px 0;border-bottom:1px solid #10151a}
.facts td:first-child{color:var(--s3);width:120px}
.facts tr:last-child td{border:none}
.mchip{display:inline-block;font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:5px;
  background:rgba(139,152,165,.11);color:var(--s2);margin:0 5px 5px 0;border:1px solid var(--ln2)}
.report{background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:15px;font-size:12px;
  line-height:1.7;color:var(--s2);white-space:pre-wrap;word-break:break-word;margin-bottom:16px}
.logs{background:#040507;border:1px solid var(--ln2);border-radius:10px;padding:13px;font-family:var(--mono);
  font-size:10.5px;line-height:1.65;color:#7d8b99;white-space:pre-wrap;max-height:230px;overflow:auto;margin-bottom:16px}
ol.trace{list-style:none;margin-bottom:16px}
ol.trace li{position:relative;padding-left:28px;padding-bottom:16px}
ol.trace li:last-child{padding-bottom:0}
.tline{position:absolute;left:7px;top:16px;bottom:0;width:1px;background:var(--ln2)}
.tdot{position:absolute;left:0;top:2px;width:15px;height:15px;border-radius:50%;background:var(--bg);
  border:1px solid var(--ln2);display:grid;place-items:center}
.tdot i{width:7px;height:7px;border-radius:50%;display:block}
.trow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tnm{font-size:12px;font-weight:700;color:var(--s2)}
.tst{font-size:9px;text-transform:uppercase;letter-spacing:.09em;font-weight:800}
.tdt{font-size:10.5px;color:#6b7a8d;margin-top:2px;font-family:var(--mono);word-break:break-word}
.ctrl{background:var(--p);border:1px solid var(--ln2);border-radius:11px;padding:15px}
.ctrl h4{font-size:8.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--s3);font-weight:800;margin-bottom:12px}
.vrow{display:flex;gap:8px;margin-bottom:11px;flex-wrap:wrap}
.vb{flex:1;min-width:150px;padding:10px;border-radius:8px;border:1px solid var(--ln2);background:var(--p2);
  color:var(--s2);font-size:11.5px;font-weight:750;cursor:pointer;font-family:var(--sans);transition:.16s}
.vb:hover{border-color:var(--st);color:#fff}
.vb.tp.on{background:rgba(229,72,77,.14);border-color:var(--crit);color:var(--crit)}
.vb.fp.on{background:rgba(70,167,88,.14);border-color:var(--low);color:var(--low)}
.sel{width:100%;background:var(--p2);border:1px solid var(--ln2);border-radius:8px;padding:9px 10px;
  color:var(--ink);font-size:11.5px;font-family:var(--sans);margin-bottom:11px}
textarea{width:100%;background:var(--p2);border:1px solid var(--ln2);border-radius:8px;padding:10px;
  color:var(--ink);font-size:11.5px;font-family:var(--sans);resize:vertical;min-height:64px}
textarea:focus,.sel:focus{outline:none;border-color:var(--st)}
.saved{font-size:10px;color:var(--low);margin-top:8px;opacity:0;transition:.25s}
.saved.on{opacity:1}
h5{font-size:8.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--s3);font-weight:800;margin:0 0 10px}
.banner{background:rgba(245,217,10,.08);border:1px solid rgba(245,217,10,.28);border-radius:9px;
  padding:11px 13px;font-size:11px;color:#d9c76a;margin-bottom:14px;line-height:1.55}
</style>
</head>
<body>

<nav>
  <a class="brand" href="index.html">
    <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="48" fill="none" stroke="#46566a" stroke-width="5"/>
    <circle cx="60" cy="60" r="26" fill="none" stroke="#46566a" stroke-width="4"/><circle cx="60" cy="60" r="11" fill="#e2e8f0"/></svg>
    AI SOC Analyst
  </a>
  <div class="navr">
    <a class="nl" href="index.html">overview</a>
    <a class="nl" href="https://github.com/Zaidzyy/AI-SOC-Analyst-L1" target="_blank" rel="noopener">github ↗</a>
    <span class="live"><span class="dot" id="dot"></span><span id="livet">connecting</span></span>
  </div>
</nav>

<main>
  <div id="banner"></div>
  <div class="kpis" id="kpis"></div>
  <div class="charts">
    <div class="panel"><div class="ph"><span>incident volume · last 24h</span><span id="vtot"></span></div><div id="vol"></div></div>
    <div class="panel"><div class="ph">threat level</div><div id="donut"></div></div>
    <div class="panel"><div class="ph">top source IPs</div><div id="tops" class="lg"></div></div>
  </div>
  <div class="tools">
    <input class="inp" id="q" placeholder="Search IP, agent, rule…">
    <div class="seg" id="fstatus">
      <button class="on" data-v="">All</button><button data-v="new">New</button>
      <button data-v="investigating">Investigating</button><button data-v="closed">Closed</button>
    </div>
    <div class="seg" id="flevel">
      <button class="on" data-v="">Any</button><button data-v="CRITICAL">Critical</button>
      <button data-v="HIGH">High</button><button data-v="MEDIUM">Med</button><button data-v="LOW">Low</button>
    </div>
    <span class="count" id="count"></span>
  </div>
  <table>
    <thead><tr><th>Time</th><th>Source IP</th><th>Agent</th><th>Rule</th><th>Level</th><th>Score</th><th>AI verdict</th><th>Status</th></tr></thead>
    <tbody id="tbody"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody>
  </table>
</main>

<div id="scrim"></div>
<aside id="drawer" aria-hidden="true"></aside>
